[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "commitship-cli"
dynamic = ["version"]
description = "One word, one safely pushed commit. Two machine-authored branchless kernels decide how far a change may travel and what its subject may claim: zero tokens, no API key, nothing leaves your machine but the push."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "COMMERCIAL.md"]
authors = [{ name = "Devieswar Kancheti", email = "devkancheti4@gmail.com" }]
maintainers = [{ name = "Devieswar Kancheti", email = "devkancheti4@gmail.com" }]
keywords = [
    "git", "commit", "commit-message", "conventional-commits", "cli",
    "branchless", "local-first", "zero-token", "offline", "ollama",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
# Dependency-free by design: git, and the Python standard library.  A local
# model is optional and is reached over HTTP with urllib when asked for.
dependencies = []

[tool.setuptools.dynamic]
version = {attr = "ship.__version__"}

[tool.setuptools.package-data]
ship = ["ship.c", "say.c"]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "twine"]

[project.urls]
Homepage = "https://github.com/devkancheti4-design/ship"
Repository = "https://github.com/devkancheti4-design/ship"
Issues = "https://github.com/devkancheti4-design/ship/issues"

[project.scripts]
ship = "ship.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
